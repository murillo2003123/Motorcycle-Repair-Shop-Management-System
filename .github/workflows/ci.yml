name: Deliverable 2 — Automated Tests (Merge Gate)

on:
  push:
    branches: [ main, "week*/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Automated Test Suite (Arrange-Act-Assert)
        run: npm test
